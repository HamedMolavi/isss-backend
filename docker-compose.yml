version: '3.8'
services:
  isss-backend-new:
    container_name: isss-backend-new
    image: 192.168.100.100:5000/isss-backend:4.1.2
    restart: always
    stdin_open: true
    tty: true
    environment:
      #TZ: Asia/Tehran
      PORT_HTTP: 9000
      PORT_HTTPS: 4000
      HOST: 0.0.0.0
      BASE_URL: 0.0.0.0:9000/api/v1
      MONGODB_URL: mongodb://ariapa:ariapa@192.168.1.116:27021/test?authSource=admin&directConnection=true
      REDIS_URL: redis://:${Password_init}@${HOST}:6379
      ELASTIC_SEARCH: http://${ELASTIC_USERNAME}:${Password_init}@${HOST}:9200
      NODE_ENV: development
      WEB_STREAM: http://${HOST}:8083/testcamera/
      RECORD_STREAM_TIME: 15000
      TREACKER_SEARCH_URL: http://${ELASTIC_USERNAME}:${Password_init}@${HOST}:9200/facearc_log/_search
      SAMPLE_STREAM_URI: rtsp://${NVR_HOST}:554/unicast/c0/s0/live
      WORD_BEFORE_REPLACE_STREAM: c0
      WORD_AFTER_REPLACE_STREAM: c
      KAFKA_BOOTSTRAP: ${HOST}:9092
      REQUEST_LOG_DIR: /isss-backend/src/logs
      SESSION_SECRET: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImFhYSI6dHJ1ZX0
      MAX_LOAD: 100
      SIGNAL_TOPIC: signal
      SIGNAL_KEY: connect
      MODELS: ${SELECTED_MODELS:-face,plate}
      FACE_INDEX: ${FACE_INDEX:-face_log}
      PLATE_INDEX: ${PLATE_INDEX:-plate_log}
      HUMAN_INDEX: human_log
      SABOTAGE_INDEX: sabotage_log
      OBJECT_INDEX: objectdetecion_log
      NODE_OPTIONS: '--max-old-space-size=6144'
      MAX_CAMERAS: ${MAX_CAMERAS:-12}
      MAX_FACES: ${MAX_FACES:-12}
      MAX_PLATES: ${MAX_PLATES:-12}
      # Logging Configuration (New)
      LOG_LEVEL: info
      LOG_TTL_DAYS: 30
      SQLITE_DB_PATH: ./src/data/integrity/integrity.db
      # Security Configuration (New)
      RATE_LIMIT_WINDOW: 900000
      RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_MAX: 5
      HSTS_MAX_AGE: 31536000
      # Session Configuration (New)
      SESSION_LIMIT_PER_USER: 3
      SESSION_CLEANUP_INTERVAL: 300000
      # Integrity Monitoring (New)
      INTEGRITY_CHECK_INTERVAL: 3600000
      BACKUP_RETENTION_DAYS: 90
    ports:
      - 9001:9000
      - 8881:4000
    healthcheck:
      test: ['CMD', 'curl', '--fail', '-G', 'http://localhost:9000/api/v1/healthcheck']
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    labels:
      - '${HEAL}=true'
    networks:
      - external-net

networks:
  external-net:
    driver: bridge
