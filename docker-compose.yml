version: "3.7"
services:
  mongo:
    container_name: mongo
    image: ${REG}mongo
    restart: always
    volumes:
      - ./data:/data/db
    ports:
      - 27017:27017
  redis:
    container_name: redis
    image: ${REG}redis
    restart: always
    volumes: 
      - cache:/data
    ports:
      - 6379:6379
  app:
    container_name: app
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - PORT=${PORT_http}
      - MONGO_URL=${MONGODB_URL}
    ports:
      - 3000:3000
    external_links:
      - mongo
      - redis
    depends_on:
      - mongo
      - redis
volumes:
  cache:
    driver: local
  mongo-data:
    driver: local
